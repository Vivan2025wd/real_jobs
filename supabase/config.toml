# Supabase CLI configuration
# Docs: https://supabase.com/docs/guides/local-development/cli/config

project_id = "next-gen-job-marketplace"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324
# Auth emails (magic link, verification) land here in local dev:
# http://localhost:54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/api/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false  # set true in production

[auth.email.template.magic_link]
subject = "Your magic link to sign in"

[auth.email.template.confirmation]
subject = "Confirm your email address"

[auth.email.template.recovery]
subject = "Reset your password"

[auth.email.template.invite]
subject = "You have been invited"

[auth.external.github]
enabled = false

[auth.external.google]
enabled = false

[analytics]
enabled = false
port = 54327
vector_port = 54328
backend = "postgres"

[edge_runtime]
enabled = true
policy = "per_worker"

[realtime]
enabled = true

# Cron-free locally — your Next.js cron routes are triggered manually
# or via `vercel dev` when deployed.